version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd app
        - npm ci --legacy-peer-deps
    build:
      commands:
        - npm run build
        - node scripts/write-env.mjs
  artifacts:
    baseDirectory: app/.amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - app/node_modules/**/*
      - app/.next/cache/**/*
