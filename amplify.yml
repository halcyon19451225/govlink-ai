version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd app
        - npm ci --legacy-peer-deps
    build:
      commands:
        - npm run build
        - cp -r public .next/standalone/
        - cp -r .next/static .next/standalone/.next/
  artifacts:
    baseDirectory: app/.next/standalone
    files:
      - '**/*'
  cache:
    paths:
      - app/node_modules/**/*
      - app/.next/cache/**/*
